  <!-- Inline style, not the bg-midnight-gold-dust CLASS: same pre-hydration dark background
       (#080c16, matches the class's own background-color), but without the class name that
       src/index.css's ".bg-midnight-gold-dust input { color: #fff !important }" rule keys off of.
       That rule is meant to style inputs on the dark public storefront -- it's supposed to be
       scoped to the React-rendered wrapper div (App.tsx) that carries the real class, not <body>.
       Because this static class sat directly on <body> from the very first paint (before React
       even mounts) and nothing ever removed it, it applied everywhere, all the time, including
       admin's light-themed forms -- every admin input rendered white-on-white, text invisible
       while typing, on every admin page (found 2026-08-28: owner reported unreadable input boxes,
       traced to this). -->
